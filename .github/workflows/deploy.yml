name: Deploy to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 20.41.123.187
          username: azureuser
          key: ${{ secrets.SSH_KEY }}
          script: |
            bash /var/www/deploy.sh
